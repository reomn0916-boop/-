<title>案件ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* Layout: sticky toolbar over a four-lane board (lanes swipe sideways on phones) or a month grid; a record drawer slides in from the right. */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --sunken:#E2E6E0; --ink:#1B211E; --muted:#5C6660; --line:#D1D7D0;
  --accent:#C24E1C; --accent-ink:#FFFFFF; --accent-soft:#F6E2D8;
  --s-todo:#76807A; --s-doing:#2E6BAE; --s-review:#A9790F; --s-done:#2C8553; --danger:#B3261E;
  --shadow:0 1px 2px rgba(27,33,30,.08),0 2px 8px rgba(27,33,30,.06);
  --f-head:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1C2220; --sunken:#171C1A; --ink:#E5EAE6; --muted:#98A39C; --line:#2D3531;
  --accent:#E8743F; --accent-ink:#1B120D; --accent-soft:#3A2419;
  --s-todo:#9CA6A0; --s-doing:#6EA5E0; --s-review:#D8AA46; --s-done:#5DBA85; --danger:#F08A80;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1C2220; --sunken:#171C1A; --ink:#E5EAE6; --muted:#98A39C; --line:#2D3531;
  --accent:#E8743F; --accent-ink:#1B120D; --accent-soft:#3A2419;
  --s-todo:#9CA6A0; --s-doing:#6EA5E0; --s-review:#D8AA46; --s-done:#5DBA85; --danger:#F08A80;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- toolbar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-family:var(--f-head);font-size:19px;margin:0;letter-spacing:.04em}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;background:var(--sunken);border-radius:8px;padding:3px}
.tabs a{padding:5px 14px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:0 10px}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;min-width:0}
.filters input[type=search]{width:180px;max-width:100%}
.chip-toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip-toggle[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.count{color:var(--muted);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}

.banner{margin:12px 0 0;padding:10px 14px;border-radius:8px;background:var(--accent-soft);font-size:13px}
.banner[hidden]{display:none}

/* ---------- board ---------- */
main{padding-block:16px 40px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--sunken);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.col-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.col-head h2{font-family:var(--f-head);font-size:14px;margin:0;letter-spacing:.06em}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.col-head .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.col-body{display:flex;flex-direction:column;gap:8px;padding:4px 8px 8px;min-height:60px}
.col-foot{padding:0 8px 10px}
.add-inline{width:100%;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px 10px;color:var(--muted);font-size:13px}
.add-inline:hover{border-color:var(--muted);color:var(--ink)}
.add-form input{width:100%;border:1px solid var(--accent);border-radius:8px;padding:7px 10px;background:var(--surface)}

.card{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:10px 11px 9px;border-left:3px solid var(--c);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;gap:6px;text-align:left}
.card:hover{box-shadow:0 0 0 1px var(--line),var(--shadow)}
.card.dragging{opacity:.35}
.card .proj{font-size:11px;color:var(--muted);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ttl{font-weight:500;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.card .ttl.untitled{color:var(--muted)}
.card .cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;background:var(--sunken);max-width:100%}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.due{font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--sunken);font-variant-numeric:tabular-nums}
.due.soon{background:var(--accent-soft);color:var(--accent)}
.due.over{background:var(--danger);color:var(--surface)}
.avatar{width:20px;height:20px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunken)}
.meta .who{margin-left:auto;display:flex;align-items:center;gap:5px;max-width:60%;overflow:hidden}
.meta .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop-mark{height:3px;border-radius:2px;background:var(--accent);margin:-2px 0}
.drag-ghost{position:fixed;z-index:60;pointer-events:none;transform:rotate(2deg);box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:.95}

.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-head);font-size:16px;margin-bottom:6px}

@media (max-width:820px){
  .board-scroll{overflow-x:auto;scroll-snap-type:x mandatory;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-padding-left:max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
  .board{grid-template-columns:repeat(4,82vw);width:max-content}
  .col{scroll-snap-align:start}
  .filters input[type=search]{width:100%;order:9}
  .count{margin-left:0}
}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{font-family:var(--f-head);font-size:20px;margin:0 6px 0 0;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--sunken);text-align:center;font-size:12px;padding:6px 0;color:var(--muted);font-weight:500}
.dow.sun,.day.sun .dn{color:var(--danger)}
.dow.sat,.day.sat .dn{color:var(--s-doing)}
.day{background:var(--surface);min-height:104px;padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;min-width:0;cursor:pointer}
.day.out{background:var(--sunken)}
.day.out .dn{opacity:.45}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-family:var(--f-mono);font-size:12px;line-height:1;padding:3px 2px;font-variant-numeric:tabular-nums}
.day.today .dn{background:var(--accent);color:var(--accent-ink)!important;border-radius:4px;align-self:flex-start;padding:3px 5px}
.ev{font-size:11.5px;line-height:1.35;padding:1px 5px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.55;text-decoration:line-through}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.daylist{margin-top:14px;background:var(--surface);border-radius:10px;border:1px solid var(--line);padding:12px 14px}
.daylist h3{margin:0 0 8px;font-family:var(--f-head);font-size:15px}
.daylist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.daylist li button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;padding:6px 4px;border-radius:6px}
.daylist li button:hover{background:var(--sunken)}
.daylist .st{font-size:11px;padding:1px 7px;border-radius:999px;color:var(--surface);background:var(--c);flex:none}
.daylist .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){
  .day{min-height:58px;padding:4px 3px}
  .day .ev,.day .more{display:none}
  .dots{display:flex}
}

/* ---------- 部署間連絡 ---------- */
.tabs a .b{display:inline-block;margin-left:5px;font-size:10.5px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-align:center;font-variant-numeric:tabular-nums}
.rk{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.rk{grid-template-columns:minmax(0,1fr)}}
.rk-main{min-width:0}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.subnav .b{font-size:11px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--sunken);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.subnav .b.hot{background:var(--accent);color:var(--accent-ink)}
.req-list{display:flex;flex-direction:column;gap:10px}
.req{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--c);min-width:0}
.req .top-row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted)}
.route{font-weight:700;color:var(--ink);font-size:13px}
.req .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.tag.money{border-color:var(--s-review);color:var(--s-review)}
.tag.ok{border-color:var(--s-done);color:var(--s-done)}
select.st{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;background:var(--surface);color:var(--ink)}
.reply{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply b{font-size:11px;color:var(--muted);display:block;font-weight:500}
.reply-edit{display:flex;flex-direction:column;gap:6px}
.reply-edit textarea{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface);width:100%;resize:vertical}
.req .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{border:0;background:transparent;color:var(--accent);padding:0;font-size:12.5px;text-decoration:underline;text-align:left}
.req-form{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.req-form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.req-form .full{grid-column:1/-1}
.req-form select,.req-form input,.req-form textarea{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface);color:var(--ink);font-size:14px;min-width:0;width:100%}
.req-form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px}
.req-form .chk input{width:auto}
@media (max-width:520px){.req-form{grid-template-columns:minmax(0,1fr)}}
.depts{display:flex;flex-direction:column;gap:10px;min-width:0}
.depts h2{font-family:var(--f-head);font-size:16px;margin:0}
.depts p{margin:0;font-size:12.5px;color:var(--muted)}
.dept{background:var(--surface);border-radius:10px;border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dept .dh{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.dept .dh b{color:var(--ink);font-size:14px}
.dept textarea{border:1px solid transparent;border-radius:6px;background:var(--bg);padding:6px 8px;min-height:76px;resize:vertical;width:100%;font-size:13px}
.dept textarea:focus{border-color:var(--line)}
.audit{border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.audit b{display:block;font-size:12px;color:var(--c)}
.ai-note{font-size:12px;color:var(--muted)}
.busy{font-size:12.5px;color:var(--accent)}
.btn.ai{border-color:var(--accent);color:var(--accent)}
.prompts{display:flex;flex-direction:column;gap:6px}
.prompts details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prompts summary{cursor:pointer;font-weight:500;font-size:13px}
.prompts textarea{margin-top:6px;width:100%;min-height:150px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 8px;font-size:12.5px;line-height:1.6;resize:vertical}
.prompts input{margin-top:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:5px 8px;width:140px;font-family:var(--f-mono)}
.rel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rel li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.rel .st{font-size:11px;padding:1px 7px;border-radius:999px;color:var(--surface);background:var(--c);flex:none}
.rel .t{min-width:0;overflow-wrap:anywhere}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);z-index:41;background:var(--surface);box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
.d-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line)}
.d-head .crumb{color:var(--muted);font-size:12px;margin-right:auto}
.d-body{overflow-y:auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:18px}
.title-in{field-sizing:content;min-height:1.6em;width:100%;border:0;background:transparent;font-family:var(--f-head);font-size:21px;line-height:1.35;padding:2px 0;border-bottom:1px solid transparent;resize:none;overflow:hidden}
.title-in:hover,.title-in:focus{border-bottom-color:var(--line);outline:none}
.fields > *{min-width:0}
.fields{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px 12px;align-items:center}
.fields label,.fields .lb{font-size:12px;color:var(--muted)}
.fields input,.fields select,.fields textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;width:100%;min-width:0}
.fields textarea{min-height:70px;resize:vertical}
.daterow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daterow input{width:auto;flex:1;min-width:130px;font-family:var(--f-mono);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));font-weight:700}
.picker{position:relative}
.picker .cur{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.menu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:5;padding:6px;display:flex;flex-direction:column;gap:2px}
.menu input{margin-bottom:4px}
.menu button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 8px;border-radius:6px;text-align:left}
.menu button:hover{background:var(--sunken)}
.menu .hint{font-size:12px;color:var(--muted);padding:4px 8px}
.sect h3{font-family:var(--f-head);font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sect h3 .n{color:var(--muted);font-family:var(--f-body);font-size:12px;font-weight:400}
.composer{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.composer textarea{border:0;background:transparent;resize:vertical;min-height:58px;width:100%}
.composer textarea:focus{outline:none}
.composer .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.composer .row .sp{margin-left:auto}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .th{position:relative;width:64px;height:64px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;display:block}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:12px;line-height:20px;padding:0}
.timeline{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.note{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.note .avatar{width:28px;height:28px}
.note .nh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.note .nh b{color:var(--ink);font-weight:500;font-size:13px}
.note .nh .del{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12px;padding:0 2px}
.note .nh .del:hover{color:var(--danger)}
.note p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:6px}
.gallery button{padding:0;border:0;background:var(--sunken);border-radius:6px;overflow:hidden;aspect-ratio:1;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.danger-zone{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.muted{color:var(--muted)}
.ro-note{font-size:12px;color:var(--muted)}

</style>

<script>
(() => {
"use strict";
const STATUSES = [
  {id:"todo",   label:"未着手",   c:"var(--s-todo)"},
  {id:"doing",  label:"進行中",   c:"var(--s-doing)"},
  {id:"review", label:"確認待ち", c:"var(--s-review)"},
  {id:"done",   label:"完了",     c:"var(--s-done)"},
];
const SMAP = Object.fromEntries(STATUSES.map(s => [s.id, s]));
const WD = ["日","月","火","水","木","金","土"];
const $ = id => document.getElementById(id);
const DEPTS = [
  {id:"keiri", label:"経理",     scope:"請求書・支払・入金管理・月次の数字・資金繰り・設備投資の資金試算", hint:"月次の売上・入金・支払予定、資金残高の概況、請求の締め日"},
  {id:"keiei", label:"経営",     scope:"方針・目標・投資判断・見積もり・積算・過去工事の実績", hint:"今期の方針、受注目標、投資・採用の判断結果、優先する現場"},
  {id:"sekou", label:"施工管理", scope:"工程・品質・原価・安全・書類申請・職人手配・材料の拾い出しと発注", hint:"現場ごとの進捗率・出来高、工程の遅れ、追加工事の発生、安全上の問題"},
];
const FROMS = [...DEPTS, {id:"shacho", label:"社長"}];
const deptLabel = id => (FROMS.find(d => d.id === id) || {label: id ? id : "未振り分け"}).label;
const RSTAT = [
  {id:"open",    label:"未対応",   c:"var(--s-todo)"},
  {id:"doing",   label:"対応中",   c:"var(--s-doing)"},
  {id:"pending", label:"確認待ち", c:"var(--s-review)"},
  {id:"done",    label:"完了",     c:"var(--s-done)"},
];
const RSMAP = Object.fromEntries(RSTAT.map(s => [s.id, s]));

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}

/* ---------- state ---------- */
const S = {
  tasks: new Map(), loaded:false, view:"board",
  month: firstOfMonth(new Date()), selDay:null,
  openId:null, notes:[], notesUnsub:null, notesFor:null,
  fProject:"", fMine:false, q:"",
  myId:null, canWrite:true, canEdit:false, profiles:{},
  dragging:false, deferred:false, pendingFiles:[], confirmDelete:false, picker:false,
  reqs:new Map(), reqLoaded:false, depts:{}, rkTab:"all", myDept:"", reqFormOpen:false, reqFormTask:null, editReply:null, confirmReq:null,
  prompts:{}, sample:null, drafts:{}, aiBusy:{},
};
let db = null, user = null, assets = null, loadTimer = null;

try { const p = JSON.parse(localStorage.getItem("anken-filters") || "{}"); S.fProject = p.fProject || ""; S.fMine = !!p.fMine; S.rkTab = p.rkTab || "all"; S.myDept = p.myDept || ""; } catch(e) {}
function saveFilters(){ try { localStorage.setItem("anken-filters", JSON.stringify({fProject:S.fProject, fMine:S.fMine, rkTab:S.rkTab, myDept:S.myDept})); } catch(e) {} }

/* ---------- dates ---------- */
function firstOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYmd(s){ if(!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function todayYmd(){ return ymd(new Date()); }
function fmtDay(s){ const d = parseYmd(s); return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"; }
function daysBetween(a,b){ return Math.round((parseYmd(b) - parseYmd(a)) / 864e5); }
function fmtStamp(iso){ const d = new Date(iso); if (isNaN(d)) return ""; return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function dueInfo(t){
  if (!t.due) return null;
  const left = daysBetween(todayYmd(), t.due);
  let cls = "", txt = fmtDay(t.due);
  if (t.status !== "done"){
    if (left < 0){ cls = "over"; txt += " · "+(-left)+"日超過"; }
    else if (left === 0){ cls = "soon"; txt += " · 今日"; }
    else if (left <= 3){ cls = "soon"; txt += " · 残り"+left+"日"; }
  }
  return {cls, txt};
}

/* ---------- people ---------- */
function prof(id){ return (id && S.profiles[id]) || null; }
function nameOf(id){ const p = prof(id); return (p && p.name) || (id && id === S.myId ? "自分" : "メンバー"); }
function avatarOf(id){ const p = prof(id); return p && p.avatarUrl; }
function avatarEl(id, cls){ const src = avatarOf(id); return src ? h("img",{class:cls||"avatar",src,alt:""}) : h("span",{class:cls||"avatar"}); }
async function refreshProfiles(){
  if (!user) return;
  const ids = new Set();
  for (const t of S.tasks.values()) if (t.assignee) ids.add(t.assignee);
  for (const n of S.notes) if (n.author) ids.add(n.author);
  if (S.myId) ids.add(S.myId);
  const missing = [...ids].filter(id => !(id in S.profiles));
  if (!missing.length) return;
  for (const id of missing) S.profiles[id] = null;
  const ps = await user.profiles(missing);
  Object.assign(S.profiles, ps);
  render();
}

/* ---------- ui helpers ---------- */
let toastTimer;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }
function banner(msg){ const b = $("banner"); b.textContent = msg || ""; b.hidden = !msg; }
function writeError(e){
  const code = e && e.code;
  if (code === "invalid_argument"){ S.canWrite = false; toast("このボードを編集する権限がありません。閲覧のみ可能です。"); render(); }
  else if (code === "quota_exceeded") toast("保存容量の上限に達しました。不要なカードや写真を削除してください。");
  else if (code === "resource_exhausted") toast("操作が集中しています。少し待ってからもう一度お試しください。");
  else toast("保存できませんでした。通信状態を確認してもう一度お試しください。");
  console.warn(e);
}
async function withRetry(fn){
  try { return await fn(); }
  catch(e){
    if (e && (e.code === "unavailable" || e.code === "store_unavailable")){ await new Promise(r => setTimeout(r, 400 + Math.random()*600)); return fn(); }
    throw e;
  }
}
const tasksCol = () => db.collection("tasks");
async function patchTask(id, data){
  if (!db) return;
  try { await withRetry(() => tasksCol().doc(id).update({...data, updatedAt:new Date().toISOString(), updatedBy:S.myId})); }
  catch(e){ writeError(e); }
}

/* ---------- filtering ---------- */
function visibleTasks(){
  const q = S.q.trim().toLowerCase();
  return [...S.tasks.values()].filter(t => {
    if (S.fProject && (t.project||"") !== S.fProject) return false;
    if (S.fMine && t.assignee !== S.myId) return false;
    if (q && !((t.title||"")+" "+(t.project||"")+" "+(t.desc||"")).toLowerCase().includes(q)) return false;
    return true;
  });
}
function projectNames(){ return [...new Set([...S.tasks.values()].map(t => (t.project||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja")); }

/* ---------- render ---------- */
function render(){
  if (S.dragging){ S.deferred = true; return; }
  $("tab-board").setAttribute("aria-current", S.view === "board" ? "page" : "false");
  $("tab-calendar").setAttribute("aria-current", S.view === "calendar" ? "page" : "false");
  $("view-board").hidden = S.view !== "board";
  $("view-calendar").hidden = S.view !== "calendar";
  $("tab-renraku").setAttribute("aria-current", S.view === "renraku" ? "page" : "false");
  $("view-renraku").hidden = S.view !== "renraku";
  const rk = S.view === "renraku";
  $("newBtn").hidden = !S.canWrite || !db || rk;
  $("fMine").setAttribute("aria-pressed", String(S.fMine));
  $("fMine").hidden = !S.myId || rk;
  $("fProject").hidden = rk;
  const pend = [...S.reqs.values()].filter(r => r.status === "pending").length;
  $("rkBadge").textContent = String(pend); $("rkBadge").hidden = !pend;

  const sel = $("fProject"); const names = projectNames();
  if (S.fProject && !names.includes(S.fProject) && S.loaded) { S.fProject = ""; }
  sel.replaceChildren(h("option",{value:""},"すべての案件"), ...names.map(n => h("option",{value:n},n)));
  sel.value = S.fProject;

  const vis = visibleTasks();
  $("count").textContent = S.tasks.size ? vis.length+" / "+S.tasks.size+" 件" : "";
  if (rk){ $("count").textContent = ""; renderRenraku(); }
  else if (S.view === "board") renderBoard(vis); else renderCalendar(vis);
  renderDrawer();
}

function cardEl(t){
  const st = SMAP[t.status] || SMAP.todo;
  const di = dueInfo(t);
  const el = h("article",{class:"card",style:"--c:"+st.c,"data-id":t.id,tabindex:"0",role:"button","aria-label":(t.title||"無題")+"を開く"},
    t.project ? h("div",{class:"proj",text:t.project}) : null,
    t.cover ? h("img",{class:"cover",src:"/_blob/"+t.cover,alt:"",loading:"lazy",draggable:"false",onerror(){ this.remove(); }}) : null,
    h("div",{class:"ttl"+(t.title?"":" untitled"),text:t.title||"（無題）"}),
    (di || t.assignee) ? h("div",{class:"meta"},
      di ? h("span",{class:"due "+di.cls,text:di.txt}) : null,
      t.assignee ? h("span",{class:"who"}, avatarEl(t.assignee), h("span",{text:nameOf(t.assignee)})) : null
    ) : null
  );
  el.addEventListener("click", () => { if (suppressClick) return; openTask(t.id); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openTask(t.id); } });
  if (S.canWrite && db) el.addEventListener("pointerdown", e => startPress(e, el, t));
  return el;
}

function renderBoard(vis){
  const board = $("board");
  const kids = [];
  if (!S.tasks.size){
    kids.push(h("div",{class:"empty"},
      h("strong",{text: !db ? "共有データに接続できません" : S.loaded ? "まだカードがありません" : "読み込み中…"}),
      !db ? "claude.ai にサインインした状態でこのページを開くと、チームのカードが表示されます。"
          : S.loaded ? (S.canWrite ? "「＋ 新規カード」か各列の「＋ 追加」から、最初の案件・作業を登録してください。案件名・担当・工期・写真付きの記録をチームで共有できます。" : "編集権限のあるメンバーがカードを追加すると、ここに表示されます。")
          : "チームのカードを取得しています。"
    ));
  }
  for (const s of STATUSES){
    const list = vis.filter(t => (t.status||"todo") === s.id).sort((a,b) => (a.order||0) - (b.order||0));
    const body = h("div",{class:"col-body","data-status":s.id}, list.map(cardEl));
    const foot = h("div",{class:"col-foot"});
    if (S.canWrite && db) foot.append(addInline(s.id, foot));
    kids.push(h("section",{class:"col",style:"--c:"+s.c,"aria-label":s.label},
      h("div",{class:"col-head"}, h("span",{class:"dot"}), h("h2",{text:s.label}), h("span",{class:"n",text:String(list.length)})),
      body, foot));
  }
  board.replaceChildren(...kids);
}

function addInline(status, foot){
  return h("button",{class:"add-inline",type:"button",onclick(){
    const inp = h("input",{type:"text",placeholder:"カード名を入力して Enter",enterkeyhint:"done","aria-label":"新しいカード名"});
    const form = h("form",{class:"add-form",onsubmit(e){ e.preventDefault(); const v = inp.value.trim(); if (v){ createTask({title:v,status}); inp.value=""; } }}, inp);
    inp.addEventListener("blur", () => { if (!inp.value.trim()) foot.replaceChildren(addInline(status, foot)); });
    inp.addEventListener("keydown", e => { if (e.key === "Escape") inp.blur(); });
    foot.replaceChildren(form); inp.focus();
  }}, "＋ 追加");
}

async function createTask({title="", status="todo", open=false}){
  if (!db) return;
  const now = new Date().toISOString();
  const same = [...S.tasks.values()].filter(t => t.status === status);
  const order = same.length ? Math.max(...same.map(t => t.order||0)) + 1000 : Date.now();
  const ref = tasksCol().doc();
  const body = {title, status, order, project: S.fProject || "", assignee: S.fMine ? S.myId : null,
    start:null, due:null, desc:"", cover:null, createdAt:now, createdBy:S.myId, updatedAt:now, updatedBy:S.myId};
  try { await withRetry(() => ref.set(body)); if (open) openTask(ref.id, true); }
  catch(e){ writeError(e); }
}

/* ---------- drag & drop (mouse + touch long-press) ---------- */
let press = null, suppressClick = false;
function startPress(e, el, t){
  if (e.button !== 0 && e.pointerType === "mouse") return;
  press = {el, t, x:e.clientX, y:e.clientY, id:e.pointerId, type:e.pointerType, active:false, timer:null};
  if (e.pointerType !== "mouse"){
    press.timer = setTimeout(() => { if (press) beginDrag(press.x, press.y); }, 380);
  }
  window.addEventListener("pointermove", onMove, {passive:false});
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onCancel);
}
function onTouchMove(e){ if (S.dragging) e.preventDefault(); }
window.addEventListener("touchmove", onTouchMove, {passive:false});
function beginDrag(x, y){
  const p = press; if (!p || p.active) return;
  p.active = true; S.dragging = true;
  const r = p.el.getBoundingClientRect();
  p.dx = x - r.left; p.dy = y - r.top;
  p.ghost = p.el.cloneNode(true); p.ghost.classList.add("drag-ghost");
  p.ghost.style.width = r.width+"px"; p.ghost.style.left = r.left+"px"; p.ghost.style.top = r.top+"px";
  document.body.append(p.ghost);
  p.el.classList.add("dragging");
  p.mark = h("div",{class:"drop-mark"});
  if (navigator.vibrate) try { navigator.vibrate(12); } catch(e) {}
}
function onMove(e){
  const p = press; if (!p || e.pointerId !== p.id) return;
  const dist = Math.hypot(e.clientX - p.x, e.clientY - p.y);
  if (!p.active){
    if (p.type === "mouse"){ if (dist > 6) beginDrag(e.clientX, e.clientY); else return; }
    else { if (dist > 8){ cleanupPress(); } else { p.x = e.clientX; p.y = e.clientY; } return; }
  }
  e.preventDefault();
  p.ghost.style.left = (e.clientX - p.dx)+"px"; p.ghost.style.top = (e.clientY - p.dy)+"px";
  const sc = $("boardScroll");
  if (sc.scrollWidth > sc.clientWidth){
    if (e.clientX < 40) sc.scrollLeft -= 14; else if (e.clientX > innerWidth - 40) sc.scrollLeft += 14;
  }
  if (e.clientY < 70) scrollBy(0,-12); else if (e.clientY > innerHeight - 50) scrollBy(0,12);
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const col = under && under.closest(".col");
  const body = col && col.querySelector(".col-body");
  if (!body){ p.mark.remove(); p.target = null; return; }
  const cards = [...body.querySelectorAll(".card")].filter(c => c !== p.el);
  let idx = cards.findIndex(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height/2; });
  if (idx < 0) idx = cards.length;
  if (idx < cards.length) body.insertBefore(p.mark, cards[idx]); else body.append(p.mark);
  p.target = {status: body.dataset.status, before: cards[idx] ? cards[idx].dataset.id : null, after: cards[idx-1] ? cards[idx-1].dataset.id : null};
}
function onUp(e){
  const p = press; if (!p || e.pointerId !== p.id) return;
  if (p.active){
    suppressClick = true; setTimeout(() => suppressClick = false, 50);
    const tg = p.target;
    if (tg){
      const prev = tg.after ? S.tasks.get(tg.after) : null, next = tg.before ? S.tasks.get(tg.before) : null;
      let order;
      if (prev && next) order = ((prev.order||0) + (next.order||0)) / 2;
      else if (prev) order = (prev.order||0) + 1000;
      else if (next) order = (next.order||0) - 1000;
      else order = Date.now();
      const t = p.t;
      if (t.status !== tg.status || t.order !== order){
        const patch = {status: tg.status, order};
        if (tg.status === "done" && t.status !== "done") patch.doneAt = new Date().toISOString();
        S.tasks.set(t.id, {...t, ...patch});
        patchTask(t.id, patch);
        if (t.status !== tg.status) toast("「"+(t.title||"無題")+"」を "+SMAP[tg.status].label+" に移動しました");
      }
    }
  }
  cleanupPress();
}
function onCancel(){ cleanupPress(); }
function cleanupPress(){
  const p = press; press = null;
  window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", onCancel);
  if (!p) return;
  clearTimeout(p.timer);
  if (p.ghost) p.ghost.remove();
  if (p.mark) p.mark.remove();
  p.el.classList.remove("dragging");
  const was = S.dragging; S.dragging = false;
  if (was || S.deferred){ S.deferred = false; render(); }
}

/* ---------- calendar ---------- */
function tasksOnDay(vis, day){
  return vis.filter(t => {
    if (t.due){ const s = t.start && t.start <= t.due ? t.start : t.due; return day >= s && day <= t.due; }
    return t.start === day;
  }).sort((a,b) => (a.status === "done") - (b.status === "done") || (a.due||"").localeCompare(b.due||""));
}
function renderCalendar(vis){
  const m = S.month;
  $("calTitle").textContent = m.getFullYear()+"年 "+(m.getMonth()+1)+"月";
  const cal = $("cal");
  const kids = WD.map((w,i) => h("div",{class:"dow"+(i===0?" sun":i===6?" sat":""),text:w}));
  const start = new Date(m); start.setDate(1 - m.getDay());
  const today = todayYmd();
  const weeks = Math.ceil((m.getDay() + new Date(m.getFullYear(), m.getMonth()+1, 0).getDate()) / 7);

async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 1.5e6 && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.82));
  } catch(e){ return file; }
}
async function postNote(t, ta, btn){
  const text = ta.value.trim();
  if (!text && !S.pendingFiles.length){ ta.focus(); return; }
  btn.disabled = true; btn.textContent = "保存中…";
  const photos = [];
  try {
    for (let i = 0; i < S.pendingFiles.length; i++){
      btn.textContent = "写真をアップロード中 "+(i+1)+"/"+S.pendingFiles.length;
      const blob = await shrink(S.pendingFiles[i].file);
      const res = await withRetry(() => assets.upload(blob, blob.type ? undefined : {type:"image/jpeg"}));
      photos.push(res.id);
    }
  } catch(e){
    btn.disabled = false; btn.textContent = "記録する";
    const c = e && e.code;
    toast(c === "too_large" ? "写真が大きすぎます（20MBまで）。" : c === "unsupported_type" ? "この形式の画像は添付できません。JPEG・PNG・WebPを使ってください。" : c === "quota_or_state" ? "写真の保存容量が上限です。不要な写真を削除してください。" : "写真をアップロードできませんでした。もう一度お試しください。");
    return;
  }
  const now = new Date().toISOString();
  try {
    await withRetry(() => db.doc("tasks/"+t.id).collection("notes").add({text, photos, author:S.myId, createdAt:now}));
    const patch = {lastNoteAt:now}; if (photos.length) patch.cover = photos[0];
    await patchTask(t.id, patch);
    S.pendingFiles.forEach(f => URL.revokeObjectURL(f.url)); S.pendingFiles = [];
    const ta2 = $("noteText"); if (ta2) ta2.value = "";
    ta.value = "";
    toast("記録しました");
    renderDrawer();
  } catch(e){ writeError(e); btn.disabled = false; btn.textContent = "記録する"; }
}

function rkFilter(tab, useQ){
  const q = useQ ? S.q.trim().toLowerCase() : "";
  const list = [...S.reqs.values()].filter(r => {
    const done = r.status === "done";
    if (tab === "done" ? !done : done) return false;
    if (DEPTS.some(d => d.id === tab) && r.to !== tab) return false;
    if (tab === "none" && r.to) return false;
    if (tab === "pending" && r.status !== "pending") return false;
    if (q && !((r.body||"")+" "+(r.reply||"")).toLowerCase().includes(q)) return false;
    return true;
  });
  if (tab === "done") list.sort((a,b) => (b.doneAt||"").localeCompare(a.doneAt||""));
  else list.sort((a,b) => (isRecheck(b) - isRecheck(a)) || (b.status === "pending") - (a.status === "pending") || (a.due||"9999").localeCompare(b.due||"9999") || (b.createdAt||"").localeCompare(a.createdAt||""));

      toast("依頼を登録しました");
      close();
    } catch(err){ submit.disabled = false; writeError(err); }
  }},
    h("label",null,"差出", from), h("label",null,"宛先", to),
    h("label",{class:"full"},"内容", body),
    h("label",null,"期限", due), h("label",null,"関連する案件", task),
    h("label",{class:"chk full"}, money, "金額・契約・支払に関わる（承認されるまで完了にしない）"),
    h("div",{class:"full",style:"display:flex;gap:8px;justify-content:flex-end"},
      h("button",{class:"btn",type:"button",onclick:close},"やめる"), submit));
  setTimeout(() => body.focus(), 0);
  return form;
}
function statusPatch(r, v){
  const now = new Date().toISOString();
  if (v === "done" && r.money && !r.approvedBy && !S.canEdit){
    toast("金額・契約・支払に関わる依頼は、承認されるまで「確認待ち」になります");
    return {status:"pending", doneAt:null};
  }
  const p = {status:v, doneAt: v === "done" ? now : null};
  if (v === "done" && r.money && !r.approvedBy){ p.approvedBy = S.myId; p.approvedAt = now; }
  return p;
}
async function patchReq(id, data){
  if (!db) return;
  try { await withRetry(() => db.doc("requests/"+id).update({...data, updatedAt:new Date().toISOString(), updatedBy:S.myId})); }
  catch(e){ writeError(e); }
}
async function saveReply(r, text, finish){
  const patch = {reply:text.trim(), repliedAt:new Date().toISOString(), repliedBy:S.myId};
  if (finish) Object.assign(patch, statusPatch(r, "done"));
  else if (r.status === "open") patch.status = "doing";
  S.editReply = null; delete S.drafts[r.id];
  await patchReq(r.id, patch);
  if (finish && patch.status === "done") toast("回答して完了にしました");
  render();
}
function reqEl(r){
  const st = RSMAP[r.status] || RSMAP.open;
  const ro = !S.canWrite || !db;
  const task = r.taskId && S.tasks.get(r.taskId);
  const di = r.due && r.status !== "done" ? dueInfo({due:r.due, status:"open"}) : null;
  const toSel = h("select",{class:"st","aria-label":"宛先",disabled:ro}, h("option",{value:""},"未振り分け"), DEPTS.map(d => h("option",{value:d.id},d.label+"宛て")));
  toSel.value = r.to || "";
  toSel.addEventListener("change", () => patchReq(r.id, {to:toSel.value || null}));
  const stSel = h("select",{class:"st","aria-label":"状態",disabled:ro}, RSTAT.map(s => h("option",{value:s.id},s.label)));
  stSel.value = r.status || "open";
  stSel.addEventListener("change", () => { const p = statusPatch(r, stSel.value); stSel.value = p.status; patchReq(r.id, p); });
  const editing = S.editReply === r.id && !ro;
  const canDel = !ro && (S.canEdit || r.createdBy === S.myId);
  const actions = [];
  if (!ro && !editing) actions.push(h("button",{class:"btn",type:"button",onclick(){ S.editReply = r.id; render(); setTimeout(() => { const t = $("rp-"+r.id); if (t) t.focus(); }, 0); }}, r.reply ? "回答を編集" : "回答を書く"));
  if (!ro && S.sample && r.status !== "done"){
    if (S.aiBusy[r.id]) actions.push(h("span",{class:"busy",text:S.aiBusy[r.id]}));
    else {
      if (!r.to) actions.push(h("button",{class:"btn ai",type:"button",onclick(){ aiTriage(r); }},"AIで振り分け"));
      else if (!editing || !(S.drafts[r.id] || "").trim()) actions.push(h("button",{class:"btn ai",type:"button",onclick(){ aiDraft(r); }},"AIで回答案"));
      if (r.reply && !editing) actions.push(h("button",{class:"btn ai",type:"button",onclick(){ aiAudit(r); }},"監査役チェック"));
    }
  }
  if (!ro && r.status === "pending" && S.canEdit){
    actions.push(h("button",{class:"btn primary",type:"button",onclick(){ const now = new Date().toISOString(); patchReq(r.id,{status:"done",doneAt:now,approvedBy:S.myId,approvedAt:now}); toast("承認して完了にしました"); }},"承認して完了"));
    actions.push(h("button",{class:"btn",type:"button",onclick(){ patchReq(r.id,{status:"doing"}); toast("差し戻しました（対応中に戻しました）"); }},"差し戻す"));
  }
  if (canDel){
    if (S.confirmReq === r.id) actions.push(h("span",{style:"margin-left:auto;font-size:12.5px",text:"この依頼を削除しますか？"}),
      h("button",{class:"btn danger",type:"button",async onclick(){ try { await withRetry(() => db.doc("requests/"+r.id).delete()); toast("依頼を削除しました"); } catch(e){ writeError(e); } S.confirmReq = null; }},"削除する"),
      h("button",{class:"btn",type:"button",onclick(){ S.confirmReq = null; render(); }},"やめる"));
    else actions.push(h("button",{class:"btn ghost",type:"button",style:"margin-left:auto;color:var(--muted)",onclick(){ S.confirmReq = r.id; render(); }},"削除"));
  }
  let editor = null;
  if (editing){
    const ta = h("textarea",{id:"rp-"+r.id,rows:"5",placeholder:"対応した内容・回答を書く"}); ta.value = S.drafts[r.id] ?? (r.reply || "");
    ta.addEventListener("input", () => { S.drafts[r.id] = ta.value; });
    editor = h("div",{class:"reply-edit"}, ta, h("div",{class:"actions"},
      h("button",{class:"btn primary",type:"button",onclick(){ saveReply(r, ta.value, true); }}, r.money && !r.approvedBy && !S.canEdit ? "回答して確認待ちへ" : "回答して完了"),
      h("button",{class:"btn",type:"button",onclick(){ saveReply(r, ta.value, false); }},"保存のみ"),
      h("button",{class:"btn ghost",type:"button",onclick(){ S.editReply = null; delete S.drafts[r.id]; render(); }},"やめる")));
  }
  return h("article",{class:"req",style:"--c:"+st.c},
    h("div",{class:"top-row"},
      h("span",{class:"route",text:deptLabel(r.from)+" →"}), toSel, stSel,
      r.money ? h("span",{class:"tag money",text:"金額・契約・支払"}) : null,
      r.approvedBy ? h("span",{class:"tag ok",text:"承認済み"}) : null,
      r.due ? h("span",{class:"due "+(di ? di.cls : ""),text: di ? "期限 "+di.txt : "期限 "+fmtDay(r.due)}) : null,
      h("span",{style:"margin-left:auto",text:(r.date ? fmtDay(r.date)+" 受付" : "")+(r.status === "done" && r.doneAt ? " · "+fmtStamp(r.doneAt)+" 完了" : "")})),
    h("div",{class:"body",text:r.body || ""}),
    task ? h("div",null, h("button",{class:"link",type:"button",onclick(){ openTask(task.id); }}, "案件："+(task.project ? task.project+" ／ " : "")+(task.title || "（無題）"))) : null,
    r.triage ? h("div",{class:"ai-note",text:"AI振り分け："+(r.triage.reason || "")}) : null,
    auditEl(r, ro),
    !editing && r.reply ? h("div",{class:"reply"}, h("b",{text:"回答・備考"+(r.repliedAt ? "（"+fmtStamp(r.repliedAt)+"）" : "")}), r.reply) : null,
    editor,
    actions.length ? h("div",{class:"actions"}, actions) : null);
}
function isRecheck(r){ return r.status !== "done" && r.audit && r.audit.level === "recheck" ? 1 : 0; }
function auditEl(r, ro){
  const a = r.audit; if (!a) return null;
  let label, c;
  if (a.level === "recheck"){ label = "監査役：3回差し戻し・要確認"; c = "var(--danger)"; }
  else if (a.pass && a.level === "important"){ label = "監査役：合格・要承認"; c = "var(--s-review)"; }
  else if (a.pass){ label = "監査役：合格・報告のみ"; c = "var(--s-done)"; }
  else { label = "監査役：不合格（"+(a.round || 1)+"回目）"; c = "var(--danger)"; }
  return h("div",{class:"audit",style:"--c:"+c},
    h("b",{text:label+(a.at ? " · "+fmtStamp(a.at) : "")}), a.findings || "",
    !ro && !a.pass && a.fixedReply && r.status !== "done" ? h("div",{style:"margin-top:6px"}, h("button",{class:"btn",type:"button",onclick(){
      S.drafts[r.id] = a.fixedReply; S.editReply = r.id; render();
    }},"修正案を回答に反映")) : null);
}
function ctxFor(r){
  const task = r.taskId && S.tasks.get(r.taskId);
  const shared = DEPTS.map(d => "- "+d.label+"："+(((S.depts[d.id]||{}).info) || "（未記入）")).join("\n");
  return "【依頼】\n受付日："+(r.date||"")+"\n差出："+deptLabel(r.from)+"\n宛先："+(r.to ? deptLabel(r.to) : "未振り分け")+
    "\n期限："+(r.due || "なし")+"\n金額・契約・支払に関わる："+(r.money ? "はい" : "いいえ")+"\n内容："+(r.body||"")+"\n"+
    (task ? "\n【関連する案件】\n案件："+(task.project||"")+"\nカード："+(task.title||"")+"\n状態："+(SMAP[task.status]||SMAP.todo).label+
      "\n工期："+(task.start||"未定")+"〜"+(task.due||"未定")+"\nメモ："+(task.desc||"")+"\n" : "")+
    "\n【部署別の共有情報（最新）】\n"+shared+"\n"+(r.reply ? "\n【現在の回答】\n"+r.reply+"\n" : "");
}
function aiError(e){
  const c = e && e.code;
  if (c === "cancelled") return;
  if (c === "not_granted") toast("AIの利用が許可されていません。ページの権限設定から許可できます。");
  else if (c === "rate_limited") toast("AIが混み合っています。少し待ってからもう一度お試しください。");
  else if (c === "invalid_json") toast("AIの返答を読み取れませんでした。もう一度お試しください。");
  else toast("AIの応答を取得できませんでした。もう一度お試しください。");
  console.warn(e);
}
async function aiDraft(r){
  const p = S.prompts;
  const input = (p.common||"")+"\n\n"+(p[r.to]||"")+"\n\n今日は"+todayYmd()+"です。次の依頼に、"+deptLabel(r.to)+"の担当として回答案を書いてください。"+
    "そのまま回答欄に貼れる日本語の本文だけを出力し、前置きや見出しは付けないでください。分からない点は推測で埋めず「要確認：」として書いてください。\n\n"+ctxFor(r);
  S.aiBusy[r.id] = "AIが回答案を作成中…"; S.editReply = r.id; S.drafts[r.id] = ""; render();
  try {
    const {text} = await S.sample(input, {cache:false, onText:({text}) => { S.drafts[r.id] = text; const ta = $("rp-"+r.id); if (ta) ta.value = text; }});
    S.drafts[r.id] = text;
    toast("回答案ができました。確認・修正してから保存してください");
  } catch(e){ aiError(e); if (!(S.drafts[r.id]||"").trim()){ delete S.drafts[r.id]; S.editReply = null; } }
  finally { delete S.aiBusy[r.id]; render(); }
}
async function aiTriage(r){
  const input = "あなたは部署間連絡の受付係です。次の依頼を読み、宛先にふさわしい部署を1つ選んでください。\n"+
    DEPTS.map(d => "- "+d.id+"（"+d.label+"）："+d.scope).join("\n")+
    "\n判断に迷う場合は unknown にしてください。\n次のJSONだけを返してください：{\"to\":\"keiri|keiei|sekou|unknown\",\"reason\":\"40字以内の理由\"}\n\n"+ctxFor(r);
  S.aiBusy[r.id] = "AIが振り分け中…"; render();
  try {
    const res = await S.sample.json(input, {modelTier:"quick", cache:false});
    const reason = String((res && res.reason) || "").slice(0,200), now = new Date().toISOString();
    if (res && DEPTS.some(d => d.id === res.to)){
      await patchReq(r.id, {to:res.to, triage:{reason, at:now, by:"ai"}});
      toast(deptLabel(res.to)+"宛てに振り分けました");
    } else {
      await patchReq(r.id, {triage:{reason:"要確認："+reason, at:now, by:"ai"}});
      toast("AIでは判断できませんでした。宛先を選んでください");
    }
  } catch(e){ aiError(e); }
  finally { delete S.aiBusy[r.id]; render(); }
}
async function aiAudit(r){
  const p = S.prompts, th = Number(p.threshold) || 500000;
  const input = (p.auditor||"")+"\n\n重要の金額基準："+th.toLocaleString("ja-JP")+"円以上。今日は"+todayYmd()+"です。\n"+
    "次の依頼と回答を点検し、次のJSONだけを返してください：\n"+
    "{\"pass\":true または false,\"level\":\"important\" または \"minor\",\"findings\":\"所見。数字を具体的に、150字以内\",\"fixedReply\":\"不合格のときだけ、直した回答の全文。合格なら空文字\"}\n"+
    "level は、金額が基準以上・契約・支払・安全・法令に関わるなら important、それ以外は minor。\n\n"+
    "【回答した部署の指示文】\n"+(p[r.to]||"")+"\n\n"+ctxFor(r);
  S.aiBusy[r.id] = "監査役が点検中…"; render();
  try {
    const res = await S.sample.json(input, {cache:false});
    const now = new Date().toISOString(), pass = !!(res && res.pass === true);
    const prevFails = r.audit && !r.audit.pass ? (r.audit.round || 1) : 0;
    const audit = {pass, level: (res && res.level === "important") || r.money ? "important" : "minor",
      findings:String((res && res.findings) || "").slice(0,600), fixedReply: pass ? "" : String((res && res.fixedReply) || "").slice(0,8000),
      round: pass ? 0 : prevFails + 1, at:now, by:"ai"};
    const patch = {audit};
    if (pass){
      if (audit.level === "important") patch.status = "pending";
      else { patch.status = "done"; patch.doneAt = now; }
    } else if (audit.round >= 3){ audit.level = "recheck"; patch.status = "pending"; }
    else if (r.status === "open") patch.status = "doing";
    await patchReq(r.id, patch);
    toast(pass ? (audit.level === "important" ? "合格：承認待ちに回しました" : "合格：報告のみとして完了にしました") : audit.level === "recheck" ? "3回不合格：要確認として承認待ちの先頭に置きました" : "不合格：所見と修正案を確認してください");
  } catch(e){ aiError(e); }
  finally { delete S.aiBusy[r.id]; render(); }
}
const PROMPT_ITEMS = [
  {k:"common", label:"共通部分（全部署）"},
  {k:"keiri", label:"経理"}, {k:"keiei", label:"経営"}, {k:"sekou", label:"施工管理"},
  {k:"auditor", label:"監査役"},
];
function renderPrompts(){
  const box = $("prompts"), ro = !S.canEdit || !db;
  $("promptNote").textContent = "「AIで回答案」「AIで振り分け」「監査役チェック」が使う指示です。" +
    (!S.sample ? "この表示ではAI機能を使えません。" : "") + (ro ? "編集はオーナー・編集者のみです。" : "");
  if (!box.childElementCount){
    const save = async (k, v) => {
      if (v === (S.prompts[k] ?? "")) return;
      try { await withRetry(() => db.doc("config/prompts").set({...S.prompts, [k]:v, updatedAt:new Date().toISOString(), updatedBy:S.myId})); toast("AIの指示文を保存しました"); }
      catch(e){ writeError(e); }
    };
    for (const it of PROMPT_ITEMS){
      const ta = h("textarea",{id:"pr-"+it.k,"aria-label":it.label+"の指示文"});
      ta.addEventListener("change", () => save(it.k, ta.value));
      box.append(h("details",null, h("summary",{text:it.label}), ta));
    }
    const th = h("input",{id:"pr-threshold",type:"number",min:"0",step:"10000","aria-label":"重要の金額基準（円）"});
    th.addEventListener("change", () => save("threshold", Number(th.value) || 500000));
    box.append(h("details",null, h("summary",{text:"重要の金額基準"}), th, h("span",{class:"ai-note",text:" 円以上"})));
  }
  for (const it of PROMPT_ITEMS){ const ta = $("pr-"+it.k); if (ta !== document.activeElement) ta.value = S.prompts[it.k] || ""; ta.readOnly = ro; }
  const th = $("pr-threshold"); if (th !== document.activeElement) th.value = S.prompts.threshold || 500000; th.readOnly = ro;
}
function renderDepts(ro){
  const box = $("depts");
  if (!box.childElementCount){
    for (const d of DEPTS){
      const ta = h("textarea",{id:"dp-"+d.id,placeholder:d.hint,"aria-label":d.label+"の共有情報"});
      ta.addEventListener("change", async () => {
        const v = ta.value.trim();
        if (v === ((S.depts[d.id]||{}).info || "")) return;
        try { await withRetry(() => db.doc("depts/"+d.id).set({info:v, updatedAt:new Date().toISOString(), updatedBy:S.myId})); toast(d.label+"の共有情報を更新しました"); }
        catch(e){ writeError(e); }
      });
      box.append(h("div",{class:"dept"}, h("div",{class:"dh"}, h("b",{text:d.label}), h("span",{id:"dt-"+d.id})), ta));
    }
  }
  for (const d of DEPTS){
    const ta = $("dp-"+d.id), v = S.depts[d.id];
    if (ta !== document.activeElement) ta.value = (v && v.info) || "";
    ta.readOnly = ro;
    $("dt-"+d.id).textContent = v && v.updatedAt ? "最終更新 "+fmtStamp(v.updatedAt) : "未記入";
  }
}
function relatedReqs(t, ro){
  const list = [...S.reqs.values()].filter(r => r.taskId === t.id).sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||""));
  if (!list.length && ro) return null;
  return h("section",{class:"sect"},
    h("h3",null,"関連する依頼", h("span",{class:"n",text:list.filter(r => r.status !== "done").length+"件 未完了"})),
    list.length ? h("ul",{class:"rel"}, list.map(r => { const s = RSMAP[r.status] || RSMAP.open;
      return h("li",null, h("span",{class:"st",style:"--c:"+s.c,text:s.label}), h("span",{class:"t",text:deptLabel(r.from)+" → "+(r.to ? deptLabel(r.to) : "未振り分け")+"："+(r.body||"")})); })) : null,
    ro ? null : h("button",{class:"btn",type:"button",style:"margin-top:8px",onclick(){
      S.reqFormOpen = true; S.reqFormTask = t.id; $("reqForm").replaceChildren();
      closeTask(); location.hash = "#renraku"; route();
    }},"＋ この案件で他部署に依頼"));
}

/* ---------- wiring ---------- */
$("reqNew").addEventListener("click", () => { S.reqFormOpen = true; S.reqFormTask = null; $("reqForm").replaceChildren(); render(); });
function route(){
  const v = location.hash.replace("#","");
  S.view = v === "calendar" || v === "renraku" ? v : "board";
  render();
}
window.addEventListener("hashchange", route);
$("scrim").addEventListener("click", closeTask);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("lightbox").hidden){ $("lightbox").click(); return; }
  if (S.picker){ S.picker = false; renderDrawer(); return; }
  if (S.openId) closeTask();
});
$("newBtn").addEventListener("click", () => createTask({title:"", status:"todo", open:true}));
$("fProject").addEventListener("change", e => { S.fProject = e.target.value; saveFilters(); render(); });
$("fMine").addEventListener("click", () => { S.fMine = !S.fMine; saveFilters(); render(); });
$("fQ").addEventListener("input", e => { S.q = e.target.value; render(); });
$("calPrev").addEventListener("click", () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth()-1, 1); S.selDay = null; render(); });
$("calNext").addEventListener("click", () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth()+1, 1); S.selDay = null; render(); });
$("calToday").addEventListener("click", () => { S.month = firstOfMonth(new Date()); S.selDay = todayYmd(); render(); });

route();

(async () => {
  const C = window.claude;
  if (!C || !C.use){ banner("共有データに接続できません。claude.ai 上でこのページを開いてください。"); db = null; S.loaded = true; render(); return; }
  [db, user, assets, S.sample] = await Promise.all([C.use("db"), C.use("user"), C.use("assets"), C.use("sample")]);
  if (user){
    S.myId = await user.id();
    const cw = await user.can("data.write");
    S.canWrite = cw !== false;
    S.canEdit = await user.canEdit();
    const me = await user.me();
    $("who").textContent = me.name ? me.name+" でログイン中" : "";
  }
  if (!db){ S.loaded = true; banner("共有データに接続できません。claude.ai にサインインしてから開き直してください。"); render(); return; }
  loadTimer = setTimeout(() => banner(S.tasks.size ? "サーバーに接続できていません。表示が最新でない可能性があります。" : "データを取得できません。通信状態を確認してください。"), 10000);
  tasksCol().onSnapshot(snap => {
    const m = new Map();
    for (const d of snap.docs) m.set(d.id, {id:d.id, ...d.data()});
    S.tasks = m;
    if (!snap.metadata.fromCache){ S.loaded = true; clearTimeout(loadTimer); banner(""); }
    render(); refreshProfiles();
  }, err => {
    clearTimeout(loadTimer); S.loaded = true;
    banner(err.code === "revoked" ? "" : "データの同期が停止しました。ページを開き直してください。");
    render();
  });
  db.collection("requests").onSnapshot(snap => {
    const m = new Map();
    for (const d of snap.docs) m.set(d.id, {id:d.id, ...d.data()});
    S.reqs = m;
    if (!snap.metadata.fromCache) S.reqLoaded = true;
    render();
  }, err => { S.reqLoaded = true; console.warn(err); render(); });
  db.doc("config/prompts").onSnapshot(snap => { S.prompts = (snap.exists && snap.data()) || {}; render(); }, err => console.warn(err));
  db.collection("depts").onSnapshot(snap => {
    const o = {};
    for (const d of snap.docs) o[d.id] = d.data();
    S.depts = o;
    render();
  }, err => console.warn(err));
  render();
})();
})();
</script>
