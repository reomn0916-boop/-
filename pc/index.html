<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現場CAD PC</title>
<meta name="description" content="現場CAD のパソコン版。スマホ版とデータを連動して、図面の作図・編集・横断図・縦断図・測量計算・印刷ができます。">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="pc.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <span class="logo">現場CAD <small>PC</small></span>
    <span id="docTitle">無題</span><span id="dirtyMark" hidden>●</span>
    <span class="spacer"></span>
    <button id="linkBadge" class="badge" hidden>スマホから新しいデータがあります</button>
    <button id="btnHelp" class="tb-btn" title="使い方 (F1)">使い方</button>
  </header>
  <nav id="ribbonTabs" role="tablist"></nav>
  <div id="ribbon"></div>
  <div id="stylebar">
    <label>レイヤ <select id="stLayer"></select></label>
    <label>色 <select id="stColor"></select></label>
    <label>線種 <select id="stLtype"></select></label>
    <label>線幅 <select id="stLw"></select></label>
    <label>文字高 <select id="stTextH"></select></label>
    <span class="sep"></span>
    <label>縮尺 1: <select id="stScale"></select></label>
    <label>用紙 <select id="stPaper"></select></label>
    <span class="sep"></span>
    <label>入力単位 <select id="stInUnit"><option value="m">m</option><option value="mm">mm</option></select></label>
    <label>寸法表示 <select id="stDimUnit"><option value="mm">mm</option><option value="m">m</option></select></label>
  </div>
  <main id="work">
    <aside id="multibox">
      <div class="mb-head"><span id="mbIcon"></span><b id="mbTitle">選択</b></div>
      <p id="mbPrompt"></p>
      <div id="mbOpts"></div>
      <div class="mb-input">
        <label for="mbInput">座標・数値入力</label>
        <div class="mb-row"><input id="mbInput" autocomplete="off" spellcheck="false"><button id="mbEnter">入力</button></div>
        <small id="mbHint">X,Y ／ @ΔX,ΔY ／ @距離&lt;方向角 ／ 長さ ／ 点名</small>
      </div>
      <div class="mb-btns"><button id="mbOk">確定 <kbd>Enter</kbd></button><button id="mbBack">1つ戻る</button><button id="mbEsc">終了 <kbd>Esc</kbd></button></div>
      <div id="mbInfo"></div>
    </aside>
    <section id="stage">
      <canvas id="cv" tabindex="0"></canvas>
      <div id="toast" role="status"></div>
    </section>
    <aside id="side">
      <section class="pane" id="propPane"><h3>プロパティ</h3><div id="props"></div></section>
      <section class="pane" id="layerPane"><h3>レイヤ<span class="pane-tools"><button id="layAdd" title="レイヤを追加">＋追加</button></span></h3><div id="layers"></div></section>
    </aside>
  </main>
  <footer id="status">
    <span id="stMsg"></span>
    <span id="stXY">X= — Y= —</span>
    <span id="snapBar"></span>
    <span id="stInfo"></span>
  </footer>
</div>

<div id="ctxmenu" hidden></div>

<!-- 汎用ダイアログ -->
<dialog id="dlg">
  <form method="dialog" class="dlg-frame">
    <header><b id="dlgTitle"></b><button value="cancel" class="x" aria-label="閉じる">×</button></header>
    <div id="dlgBody"></div>
    <footer id="dlgBtns"></footer>
  </form>
</dialog>

<!-- 測量計算（スマホ版と共通の計算定義を使う） -->
<dialog id="calcSheet">
  <div class="dlg-frame">
    <header><button id="calcBack" class="back" hidden>‹ 一覧</button><b id="calcTitle">計算</b><button class="x" data-close aria-label="閉じる">×</button></header>
    <div id="calcBody"></div>
  </div>
</dialog>
<datalist id="ptNames"></datalist>

<!-- 印刷・PDF -->
<dialog id="printDlg">
  <div class="dlg-frame wide">
    <header><b>印刷・PDF（図面枠・表題欄付き）</b><button class="x" data-close aria-label="閉じる">×</button></header>
    <div class="print-body">
      <div class="print-preview"><canvas id="prCv"></canvas></div>
      <div class="print-form">
        <label>工事名 <input id="prKoji"></label>
        <label>図面名 <input id="prTitle"></label>
        <label>作成者 <input id="prAuthor"></label>
        <div class="grid2">
          <label>用紙 <select id="prPaper"></select></label>
          <label>向き <select id="prOrient"><option value="landscape">横</option><option value="portrait">縦</option></select></label>
          <label>縮尺 1: <select id="prScale"></select></label>
          <label>上の方向角 <input id="prRot" type="number" step="any" value="0"></label>
          <label>解像度 <select id="prDpi"><option value="200">200 dpi</option><option value="300" selected>300 dpi</option><option value="400">400 dpi</option></select></label>
        </div>
        <label class="chk"><input type="checkbox" id="prTable"> 座標表・凡例を付ける</label>
        <label class="chk"><input type="checkbox" id="prGrid"> 座標グリッドを付ける</label>
        <label class="chk"><input type="checkbox" id="prColor" checked> カラーで印刷（オフは白黒）</label>
        <p class="small">印刷範囲は図面上の用紙枠です。枠の位置は［表示］→［用紙枠の移動］で変えられます。</p>
        <div class="btnrow">
          <button id="prPdf" class="primary">PDF を保存</button>
          <button id="prPrint">印刷</button>
          <button id="prPng">画像 (PNG)</button>
          <button id="prDxf">DXF（枠付き）</button>
        </div>
      </div>
    </div>
  </div>
</dialog>

<div id="printArea"></div>
<input type="file" id="fileOpen" hidden accept=".gcad,.json,.dxf,.sim,.csv,.txt">
<input type="file" id="fileImport" hidden accept=".dxf,.sim,.csv,.txt">
<input type="file" id="fileMerge" hidden accept=".gcad,.json">
<script type="module" src="main.js"></script>
</body>
</html>
