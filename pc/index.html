<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現場CAD PC</title>
<meta name="description" content="現場CAD のパソコン版。スマホ版とデータを連動して、図面の作図・編集・横断図・縦断図・測量計算・印刷ができます。">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="pc.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 12 4l8 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="14" r="2.2" fill="currentColor"/></svg>現場CAD<small>PC</small></span>
    <div class="qat" role="toolbar" aria-label="クイックアクセス">
      <button class="qbtn" data-q="save" title="上書き保存 (Ctrl+S)"></button>
      <button class="qbtn" data-q="undo" title="元に戻す (Ctrl+Z)"></button>
      <button class="qbtn" data-q="redo" title="やり直し (Ctrl+Y)"></button>
      <button class="qbtn" data-q="print" title="印刷・PDF (Ctrl+P)"></button>
    </div>
    <div class="doc"><span id="docTitle">無題</span><span id="saveState" class="state">保存済み</span><span id="dirtyMark" hidden>●</span></div>
    <span class="spacer"></span>
    <button id="btnSearch" class="search" title="コマンドを名前で探して実行 (Ctrl+K)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>コマンドを検索</span><kbd>Ctrl K</kbd></button>
    <button id="linkBadge" class="badge" hidden>スマホから新しいデータがあります</button>
    <button id="btnTheme" class="tb-btn icon" title="明るい / 暗い表示"></button>
    <button id="btnHelp" class="tb-btn" title="使い方 (F1)">使い方</button>
  </header>
  <nav id="ribbonTabs" role="tablist"><span class="tabs-end"><button id="btnRibbonFold" class="fold" title="リボンをたたむ / 広げる (Ctrl+F1)"></button></span></nav>
  <div id="ribbon"></div>
  <div id="stylebar">
    <div class="sg"><span class="sl">レイヤ</span><span class="swatch" id="swLayer"></span><select id="stLayer"></select></div>
    <div class="sg"><span class="sl">色</span><span class="swatch" id="swColor"></span><select id="stColor"></select></div>
    <div class="sg"><span class="sl">線種</span><svg class="ltprev" id="pvLt" viewBox="0 0 44 10" aria-hidden="true"><line x1="2" y1="5" x2="42" y2="5"/></svg><select id="stLtype"></select></div>
    <div class="sg"><span class="sl">線幅</span><select id="stLw"></select></div>
    <div class="sg"><span class="sl">文字高</span><select id="stTextH"></select></div>
    <span class="sep"></span>
    <div class="sg"><span class="sl">縮尺</span><span class="pre">1 :</span><select id="stScale"></select></div>
    <div class="sg"><span class="sl">用紙</span><select id="stPaper"></select></div>
    <span class="sep"></span>
    <div class="sg"><span class="sl">入力単位</span><select id="stInUnit"><option value="m">m</option><option value="mm">mm</option></select></div>
    <div class="sg"><span class="sl">寸法表示</span><select id="stDimUnit"><option value="mm">mm</option><option value="m">m</option></select></div>
  </div>
  <main id="work">
    <aside id="multibox">
      <div class="mb-head"><span id="mbIcon"></span><div class="mb-tt"><small id="mbKind">待機中</small><b id="mbTitle">選択</b></div><span id="mbStep" hidden></span></div>
      <div id="mbPromptBox"><p id="mbPrompt"></p><div class="mb-keys" id="mbKeys"></div></div>
      <section class="mb-sec" id="mbOptsSec"><h4>設定</h4><div id="mbOpts"></div></section>
      <section class="mb-sec mb-input">
        <h4><label for="mbInput">座標・数値入力</label><span class="unit" id="mbUnit">m</span></h4>
        <div class="mb-row"><input id="mbInput" autocomplete="off" spellcheck="false" placeholder="例 10,20 ／ @5&lt;45"><button id="mbEnter">入力</button></div>
        <small id="mbHint">X,Y ／ @ΔX,ΔY ／ @距離&lt;方向角 ／ 長さ ／ 点名</small>
      </section>
      <div class="mb-btns"><button id="mbOk" class="pri">確定<kbd>Enter</kbd></button><button id="mbBack">1つ戻る<kbd>BS</kbd></button><button id="mbEsc">終了<kbd>Esc</kbd></button></div>
      <div id="mbInfo"></div>
    </aside>
    <section id="stage">
      <canvas id="cv" tabindex="0"></canvas>
      <div class="axes" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M10 34V8M10 34h26" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 11l3-5 3 5M33 31l5 3-5 3" fill="currentColor"/></svg><span class="ax-x">X 北</span><span class="ax-y">Y 東</span></div>
      <div class="navbar" role="toolbar" aria-label="表示">
        <button data-nav="all" title="全体表示 (Home)"></button>
        <button data-nav="paper" title="用紙全体"></button>
        <button data-nav="in" title="拡大 (PageUp)"></button>
        <button data-nav="out" title="縮小 (PageDown)"></button>
        <button data-nav="zbox" title="範囲を指定して拡大（作図中でも使えます）"></button>
        <button data-nav="prev" title="前の表示に戻る (Alt+←)"></button>
        <button data-nav="hand" title="手のひら: ドラッグで画面移動（Space を押しながらドラッグ・右ドラッグでも移動）"></button>
      </div>
      <div id="welcome" hidden>
        <div class="wl-card">
          <div class="wl-head"><b>現場CAD PC</b><span>図面を開くか、新しくかき始めます</span></div>
          <div class="wl-acts">
            <button data-wl="new"><i data-ic="new"></i><b>白紙からかく</b><span>用紙 A3・縮尺 1:100</span></button>
            <button data-wl="open"><i data-ic="open"></i><b>ファイルを開く</b><span>.gcad ／ DXF ／ SIMA ／ CSV</span></button>
            <button data-wl="recv"><i data-ic="recv"></i><b>スマホのデータを取り込む</b><span>現場から送られた .gcad</span></button>
            <button data-wl="sample"><i data-ic="xsec"></i><b>練習用の図面を開く</b><span>倉庫A の平面図と基準点</span></button>
          </div>
          <p class="wl-tip">ファイルは画面にドラッグしても開けます。迷ったら <kbd>F1</kbd>、コマンドは <kbd>Ctrl</kbd>+<kbd>K</kbd> で名前から探せます。</p>
        </div>
      </div>
      <div id="toast" role="status"></div>
    </section>
    <aside id="side">
      <section class="pane" id="propPane"><h3><span>プロパティ</span><span id="propCount" class="cnt"></span></h3><div id="props"></div></section>
      <section class="pane" id="layerPane"><h3><span>レイヤ</span><span class="pane-tools"><button id="layAdd" title="レイヤを追加">＋ 追加</button></span></h3><div id="layers"></div></section>
    </aside>
  </main>
  <footer id="status">
    <span id="stMsg"></span>
    <span id="stXY"><b>X</b><span id="xyX">—</span><b>Y</b><span id="xyY">—</span></span>
    <span id="snapBar"></span>
    <span id="stZoom" title="今の画面の表示倍率（用紙に対して）"></span>
    <span id="stInfo"></span>
  </footer>
</div>

<div id="tip" role="tooltip" hidden></div>
<div id="palette" hidden><div class="pl-box"><div class="pl-in"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="plInput" placeholder="コマンド名で検索（例: 寸法、逃げ、横断）" autocomplete="off" spellcheck="false"></div><div id="plList" role="listbox"></div><div class="pl-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 選ぶ</span><span><kbd>Enter</kbd> 実行</span><span><kbd>Esc</kbd> 閉じる</span></div></div></div>
<div id="ctxmenu" hidden></div>

<!-- 汎用ダイアログ -->
<dialog id="dlg">
  <form method="dialog" class="dlg-frame">
    <header><b id="dlgTitle"></b><button value="cancel" class="x" aria-label="閉じる">×</button></header>
    <div id="dlgBody"></div>
    <footer id="dlgBtns"></footer>
  </form>
</dialog>

<!-- 測量計算（スマホ版と共通の計算定義を使う） -->
<dialog id="calcSheet">
  <div class="dlg-frame">
    <header><button id="calcBack" class="back" hidden>‹ 一覧</button><b id="calcTitle">計算</b><button class="x" data-close aria-label="閉じる">×</button></header>
    <div id="calcBody"></div>
  </div>
</dialog>
<datalist id="ptNames"></datalist>

<!-- 印刷・PDF -->
<dialog id="printDlg">
  <div class="dlg-frame wide">
    <header><b>印刷・PDF（図面枠・表題欄付き）</b><button class="x" data-close aria-label="閉じる">×</button></header>
    <div class="print-body">
      <div class="print-preview"><canvas id="prCv"></canvas></div>
      <div class="print-form">
        <label>工事名 <input id="prKoji"></label>
        <label>図面名 <input id="prTitle"></label>
        <label>作成者 <input id="prAuthor"></label>
        <div class="grid2">
          <label>用紙 <select id="prPaper"></select></label>
          <label>向き <select id="prOrient"><option value="landscape">横</option><option value="portrait">縦</option></select></label>
          <label>縮尺 1: <select id="prScale"></select></label>
          <label>上の方向角 <input id="prRot" type="number" step="any" value="0"></label>
          <label>解像度 <select id="prDpi"><option value="200">200 dpi</option><option value="300" selected>300 dpi</option><option value="400">400 dpi</option></select></label>
        </div>
        <label class="chk"><input type="checkbox" id="prTable"> 座標表・凡例を付ける</label>
        <label class="chk"><input type="checkbox" id="prGrid"> 座標グリッドを付ける</label>
        <label class="chk"><input type="checkbox" id="prColor" checked> カラーで印刷（オフは白黒）</label>
        <p class="small">印刷範囲は図面上の用紙枠です。枠の位置は［表示］→［用紙枠の移動］で変えられます。</p>
        <div class="btnrow">
          <button id="prPdf" class="primary">PDF を保存</button>
          <button id="prPrint">印刷</button>
          <button id="prPng">画像 (PNG)</button>
          <button id="prDxf">DXF（枠付き）</button>
        </div>
      </div>
    </div>
  </div>
</dialog>

<div id="printArea"></div>
<input type="file" id="fileOpen" hidden accept=".gcad,.json,.dxf,.sim,.csv,.txt">
<input type="file" id="fileImport" hidden accept=".dxf,.sim,.csv,.txt">
<input type="file" id="fileMerge" hidden accept=".gcad,.json">
<script type="module" src="main.js"></script>
</body>
</html>
