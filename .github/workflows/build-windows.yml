name: Windows版をビルド

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write   # 「最新版」（自動更新用）を公開するため

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20   # 変更内容（コミットの見出し）を更新の案内に出すため
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 必要なものを入れる
        run: pip install -r requirements.txt pytest pyinstaller==6.11.1
      - name: テスト
        run: python -m pytest -q
      - name: 版の番号を入れる
        shell: pwsh
        run: |
          $v = (Get-Date).ToUniversalTime().AddHours(9).ToString("yyyy.MM.dd.HHmm") + "-" + "${{ github.sha }}".Substring(0, 7)
          "VERSION = `"$v`"`nCOMMIT = `"${{ github.sha }}`"`n" | Out-File -Encoding utf8 sekisan/_version.py
          "APP_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: exeを作る
        run: pyinstaller --noconfirm --windowed --name 積算アプリ --collect-data reportlab --collect-submodules reportlab launcher.py
      - name: 見本データを同梱
        shell: pwsh
        run: Copy-Item -Recurse sample dist/積算アプリ/見本データ
      - name: 起動の確かめ（作ったexeで画面を作って閉じる）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/積算アプリ/積算アプリ.exe" -ArgumentList "--selftest" -Wait -PassThru
          $r = Get-Content -Raw -ErrorAction SilentlyContinue "dist/積算アプリ/selftest.txt"
          Remove-Item -ErrorAction SilentlyContinue "dist/積算アプリ/selftest.txt"
          Write-Host "終了コード $($p.ExitCode) / $r"
          if ($p.ExitCode -ne 0) { throw "起動の確かめに失敗：$r" }
      - name: 自動更新の入れ替えの確かめ
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force old | Out-Null
          Copy-Item -Recurse "dist/積算アプリ" "old/積算アプリ"
          Remove-Item "old/積算アプリ/_internal/base_library.zip"
          Set-Content "old/積算アプリ/古い印.txt" "old"
          $p = Start-Process -FilePath "dist/積算アプリ/積算アプリ.exe" -ArgumentList "--finish-update", "$PWD\old\積算アプリ", "0", "--no-restart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "入れ替えに失敗（終了コード $($p.ExitCode)）" }
          if (-not (Test-Path "old/積算アプリ/_internal/base_library.zip")) { throw "入れ替えでファイルが置かれていません" }
          Write-Host "入れ替えOK"
      - uses: actions/upload-artifact@v4
        with:
          name: 積算アプリ-windows
          path: dist/積算アプリ
      - name: 「最新版」として公開（ソフトの自動更新用）
        if: github.ref_name == 'claude/dazzling-volta-wgnbkn' || github.ref_name == 'main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/積算アプリ -DestinationPath sekisan-windows.zip
          $notes = @(git log -8 --pretty=format:%s)
          $info = [ordered]@{ version = $env:APP_VERSION; commit = "${{ github.sha }}";
                              built_at = (Get-Date).ToUniversalTime().ToString("o"); notes = $notes }
          $info | ConvertTo-Json | Out-File -Encoding utf8 version.json
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --title "最新版（自動更新用）" --notes "積算アプリの最新版です。ソフトはここから自動で更新します。" --latest
          }
          gh release upload latest sekisan-windows.zip version.json --clobber
