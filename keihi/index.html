<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d7a55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ラク経費">
  <meta name="description" content="レシートを撮るだけの経費精算。金額・日付・お店を読み取り、精算書 PDF と領収書の台紙をすぐ作れます。">
  <title>ラク経費</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>ラク経費</span></div>
    <div id="topInfo" class="top-info" aria-live="polite"></div>
    <button class="icon-btn" data-act="help" aria-label="使い方"><span class="q">?</span></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="画面の切り替え">
    <button data-tab="home"><i data-ic="home"></i><span>ホーム</span></button>
    <button data-tab="list"><i data-ic="list"></i><span>一覧</span></button>
    <button class="cam" data-act="camera" aria-label="レシートを撮る"><i data-ic="camera"></i><span>撮る</span></button>
    <button data-tab="report"><i data-ic="doc"></i><span>精算</span></button>
    <button data-tab="settings"><i data-ic="sliders"></i><span>設定</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="viewer" class="viewer" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="drop" class="drop" hidden><div>ここに画像を落とすと<br>まとめて読み取ります</div></div>

  <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
  <input type="file" id="pickIn" accept="image/*" multiple hidden>
  <input type="file" id="restoreIn" accept=".json,application/json" hidden>
  <datalist id="dlPayee"></datalist>
  <datalist id="dlSite"></datalist>
  <datalist id="dlPlace"></datalist>

  <script type="module" src="js/app.js"></script>
</body>
</html>
